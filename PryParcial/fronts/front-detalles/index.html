<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Vehículo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f6fa; padding: 20px; display: flex; justify-content: center; }
        .tarjeta-detalle { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        .dato { font-size: 1.2rem; margin: 15px 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .btn-volver { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #2ecc71; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <div class="tarjeta-detalle" id="contenedor-detalle">
        <h2>Cargando información...</h2>
    </div>

    <script>
        async function cargarDetalle() {
            try {
                // 1. Leer el ID que viene en la URL (ej: /auto-detalle?id=5)
                const parametros = new URLSearchParams(window.location.search);
                const idAuto = parametros.get('id');

                if (!idAuto) {
                    throw new Error("No se especificó ningún vehículo.");
                }

                // 2. Hacer el fetch a tu API individual
                // Asegurate de que esta ruta coincida con la que armaste en rutas.mjs
                const respuesta = await fetch(`/api/v1/autos/${idAuto}`);
                
                if (!respuesta.ok) {
                    throw new Error("Vehículo no encontrado en la base de datos.");
                }

                const auto = await respuesta.json();
                const contenedor = document.getElementById('contenedor-detalle');

                // 3. Dibujar los datos en pantalla
                contenedor.innerHTML = `
                    <h2>Detalles del Vehículo</h2>
                    <div class="dato"><strong>ID Interno:</strong> ${auto.id}</div>
                    <div class="dato"><strong>Modelo:</strong> ${auto.modelo || 'N/A'}</div>
                    <div class="dato"><strong>Año de fabricación:</strong> ${auto.anio || 'N/A'}</div>
                    <div class="dato"><strong>Kilometraje:</strong> ${auto.km || '0'} km</div>
                    <div class="dato"><strong>Precio de lista:</strong> $${auto.precio || 'N/A'}</div>
                    
                    <a href="/autos" class="btn-volver">⬅ Volver al Catálogo</a>
                `;

            } catch (error) {
                console.error(error);
                document.getElementById('contenedor-detalle').innerHTML = `
                    <h2 class="error">¡Ups! Hubo un problema</h2>
                    <p>${error.message}</p>
                    <a href="/autos" class="btn-volver">⬅ Volver al Catálogo</a>
                `;
            }
        }

        // Ejecutar la función al cargar la página
        cargarDetalle();
    </script>

</body>
</html>
