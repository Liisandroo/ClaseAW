<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Vehículos VIP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .grid-autos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .tarjeta-auto {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .btn-detalle {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-salir {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-procedimiento {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Mi Catálogo de Autos</h1>
        <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
        <button class="btn-procedimiento" onclick="window.location.href='/nuevitos'">Ver Autos Seminuevos</button>
    </div>

    <div class="grid-autos" id="contenedor-autos">
        <p>Cargando vehículos...</p>
    </div>

    <script>
        // Esta función se ejecuta apenas carga la página
        async function cargarAutos() {
            try {
                // 1.pegamos la PROPIA API
                const respuesta = await fetch('/api/v1/autos');

                if (!respuesta.ok) {
                    throw new Error('Error al obtener los datos del servidor');
                }

                // 2. Convertimos la respuesta a JSON
                const autos = await respuesta.json();

                // 3. Capturamos el div donde vamos a dibujar
                const contenedor = document.getElementById('contenedor-autos');
                contenedor.innerHTML = ''; 

                // 4. Recorremos el array y creamos el HTML para cada auto
                autos.forEach(auto => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-auto';

                   
                    tarjeta.innerHTML = `
                        <h3>${auto.marca || 'Marca'} ${auto.modelo || 'Modelo'}</h3>
                        <p><strong>Año:</strong> ${auto.anio || 'N/A'}</p>
                        <p><strong>Kilometraje:</strong> ${auto.km || '0'} km</p>
                        <p><strong>Precio:</strong> $${auto.precio || 'N/A'}</p>
                        <a href="/auto-detalle?id=${auto.id}" class="btn-detalle">Ver Detalles</a>
                    `;

                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('contenedor-autos').innerHTML = '<p>Error al cargar el catálogo.</p>';
            }
        }

        // Función de prueba para cerrar sesión
        function cerrarSesion() {
            // Borra la cookie desde el navegador (como prueba rápida)
            document.cookie = "token_parcial=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = '/login';
        }

        // Llamamos a la función para que inicie el proceso
        cargarAutos();
    </script>

</body>

</html>
